name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./src

      # No network and no secrets: these cover alert shaping only.
      - name: Run tests
        run: npm test
        working-directory: ./src

      - name: Check every script parses
        run: |
          for file in monitor.js sync-tracked-calendars.js sitemap-discovery.js probe_auth.js alerting.js calendar-digest.js; do
            node --check "$file"
          done
        working-directory: ./src
