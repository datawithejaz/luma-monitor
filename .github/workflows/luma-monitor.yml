name: Luma London Monitor

on:
  schedule:
    # Every 5 minutes for faster alerts. GitHub's cron is best-effort — runs can
    # still be delayed under platform load, but this is the fastest practical interval.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # manual "Run workflow" button for testing
  # Run on pushes to main so a merge picks up new events immediately. Branches are
  # deliberately excluded: a branch run emails alerts and commits the seen ids to
  # that branch, so main re-alerts the same events on its next pass.
  push:
    branches:
      - main

permissions:
  contents: write         # needed to commit seen_events.json back

concurrency:
  group: luma-monitor
  cancel-in-progress: false   # let an in-flight run finish before the next starts

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./src

      - name: Sync tracked calendars from Lu.ma follows
        env:
          LUMA_AUTH_COOKIE: ${{ secrets.LUMA_AUTH_COOKIE }}
        run: |
          if [ -n "$LUMA_AUTH_COOKIE" ]; then
            node src/sync-tracked-calendars.js
            echo "### Calendar sync" >> "$GITHUB_STEP_SUMMARY"
            echo "Synced \`tracked_calendars.json\` from your Lu.ma Following list." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=LUMA_AUTH_COOKIE missing::New Lu.ma follows will NOT be tracked. Add the LUMA_AUTH_COOKIE repository secret (Cookie header from a signed-in api.lu.ma request), then re-run this workflow."
            echo "LUMA_AUTH_COOKIE not set — using tracked_calendars.json as-is."
            echo "### Calendar sync" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **\`LUMA_AUTH_COOKIE\` is not set.** New follows on Lu.ma are ignored until you add this repository secret." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          LUMA_AUTH_COOKIE: ${{ secrets.LUMA_AUTH_COOKIE }}
        run: node src/monitor.js

      - name: Commit updated state (only if changed)
        run: |
          git config user.name  "luma-monitor[bot]"
          git config user.email "luma-monitor@users.noreply.github.com"
          git add src/tracked_calendars.json src/seen_events.json src/event_meta.json src/known_calendars.json src/sitemap_crawl.json src/calendar_digest.json
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore: update seen events [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push
          fi
